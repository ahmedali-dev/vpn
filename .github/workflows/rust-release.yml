name: TunnelNest Rust Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'rust-v*'

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build ${{ matrix.distro }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-24.04
            target: linux-x64
            runner: ubuntu-24.04
            image: ubuntu:24.04
          - distro: fedora-44
            target: linux-x64
            runner: ubuntu-24.04
            image: registry.fedoraproject.org/fedora:44
          - distro: arch
            target: linux-x64
            runner: ubuntu-24.04
            image: archlinux:base-devel
    defaults:
      run:
        shell: bash
        working-directory: "sshTLS-v2ray-tunnel/rust"
    env:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /opt/tunnelnest/cargo
      RUSTUP_HOME: /opt/tunnelnest/rustup
      # Link each distribution's OpenSSL; Fedora/Arch need no static SSL archives.
      OPENSSL_STATIC: '0'
      TUNNEL_PACKAGE_TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install native distribution dependencies
        working-directory: ${{ github.workspace }}
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          case "$DISTRO" in
            ubuntu-24.04)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends git curl ca-certificates python3 build-essential pkg-config libssl-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev tar gzip unzip dpkg-dev desktop-file-utils
              ;;
            fedora-44)
              dnf install -y git curl-minimal ca-certificates python3 gcc gcc-c++ make perl pkgconf-pkg-config openssl-devel dbus-devel gtk3-devel webkit2gtk4.1-devel tar gzip unzip which rpm-build desktop-file-utils
              ;;
            arch)
              pacman -Syu --noconfirm --needed git curl ca-certificates python base-devel pkgconf openssl dbus gtk3 webkit2gtk-4.1 tar gzip unzip which desktop-file-utils
              ;;
            *) echo "Unsupported distribution: $DISTRO" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release version before building
        run: |
          if [[ "$GITHUB_REF" == refs/tags/rust-v* ]]; then
            version="${GITHUB_REF_NAME#rust-v}"
          else
            version="$(python3 -c 'from scripts.version import package_version; from pathlib import Path; print(package_version(Path("Cargo.toml").read_text()))')"
          fi
          python3 scripts/version.py "$version" --check
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Install stable Rust inside the distribution container
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/tunnelnest-rustup.sh"
          sh "$RUNNER_TEMP/tunnelnest-rustup.sh" -y --profile minimal --default-toolchain stable --component rustfmt --component clippy --no-modify-path
          printf '%s/bin\n' "$CARGO_HOME" >> "$GITHUB_PATH"
      - name: Fetch checksum-verified networking cores
        run: python3 scripts/fetch-cores.py
      - name: Test packaging and native package metadata
        env:
          TUNNELNEST_TEST_DISTRO: ${{ matrix.distro }}
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check Rust formatting and code
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --features desktop -- -D warnings
      - name: Test Rust engine, native exports, and core schemas
        run: cargo test --locked --features desktop
      - name: Test shared interface
        run: |
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
          node --test desktop/*.test.cjs
      - name: Build native application
        run: python3 scripts/build.py
      - name: Package distribution-specific application and cores
        env:
          DISTRO: ${{ matrix.distro }}
        run: python3 scripts/archive.py --target "$TUNNEL_PACKAGE_TARGET" --distro "$DISTRO" --version "$RELEASE_VERSION" --native-package
      - name: Install and verify native package
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          case "$DISTRO" in
            ubuntu-24.04) apt-get install -y ./dist/release/*.deb ;;
            fedora-44) dnf install -y ./dist/release/*.rpm ;;
            arch)
              pacman -U --noconfirm ./dist/release/*.pkg.tar.zst
              ;;
          esac
          desktop-file-validate /usr/share/applications/org.tunnelnest.rust.desktop
          tunnelnest --help
          /usr/lib/tunnelnest/cores/sing-box version
          /usr/lib/tunnelnest/cores/xray version
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.distro }}-${{ matrix.target }}
          path: "sshTLS-v2ray-tunnel/rust/dist/release/*"
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: "sshTLS-v2ray-tunnel/rust"
    env:
      CARGO_TERM_COLOR: always
      TUNNEL_PACKAGE_TARGET: win32-x64
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release version before building
        run: |
          if [[ "$GITHUB_REF" == refs/tags/rust-v* ]]; then
            version="${GITHUB_REF_NAME#rust-v}"
          else
            version="$(python3 -c 'from scripts.version import package_version; from pathlib import Path; print(package_version(Path("Cargo.toml").read_text()))')"
          fi
          python3 scripts/version.py "$version" --check
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Install Windows OpenSSL
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $openssl = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md"
          "OPENSSL_DIR=$openssl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$openssl/lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$openssl/include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIBS=libssl:libcrypto" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Fetch checksum-verified networking cores
        run: python3 scripts/fetch-cores.py
      - name: Test portable Windows packaging
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check Rust formatting and code
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --features desktop -- -D warnings
      - name: Test Rust engine, native exports, and core schemas
        run: cargo test --locked --features desktop
      - name: Test shared interface
        run: |
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
          node --test desktop/*.test.cjs
      - name: Build native application
        run: python3 scripts/build.py
      - name: Package native application and networking cores
        run: python3 scripts/archive.py --target "$TUNNEL_PACKAGE_TARGET" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-win32-x64
          path: "sshTLS-v2ray-tunnel/rust/dist/release/*"
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rust-v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-*
          merge-multiple: true
          path: release-assets
      - name: Verify every archive checksum
        working-directory: release-assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          checksums=(*.sha256)
          test "${#checksums[@]}" -eq 7
          for checksum in "${checksums[@]}"; do sha256sum --check "$checksum"; done
          cat "${checksums[@]}" > SHA256SUMS.txt
          rm -- "${checksums[@]}"
      - name: Create draft, upload all files, then publish
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#rust-v}"
          notes="sshTLS-v2ray-tunnel/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes" ]]; then
            notes="$RUNNER_TEMP/rust-release-notes.md"
            cat > "$notes" <<NOTES
          TunnelNest Rust $version

          Native Rust desktop and CLI builds: Windows x64 ZIP, Ubuntu 24.04 x64 DEB, Fedora 44 x64 RPM, and Arch Linux x64 pkg.tar.zst. Portable Linux tarballs are also included. Every package includes Xray and sing-box plus their licenses. Verify downloads against SHA256SUMS.txt. All builds require an x86_64/AMD64 machine; ARM64 and 32-bit systems are excluded.

          Builds are unsigned. Windows requires WebView2. Each Linux archive is built inside its named distribution and needs that distribution's GTK 3, WebKitGTK 4.1, OpenSSL, and D-Bus runtime libraries. Arch builds target the rolling release at build time. Live VPN connections, native authorization, and actual TUN routing require platform testing. Existing Go profiles can be transferred using shared profile codes/files.
          NOTES
          fi
          # A failed upload leaves a draft. A rerun resumes it; published releases
          # are never overwritten or replaced.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            [[ "$draft" == true ]] || { echo 'Release is already published; refusing to overwrite it.' >&2; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "TunnelNest Rust $version" --notes-file "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --title "TunnelNest Rust $version" --notes-file "$notes" --draft=false
