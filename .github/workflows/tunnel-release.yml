name: Tunnel Desktop Release

'on':
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tunnel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: win32-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: sshTLS-v2ray-tunnel
    env:
      TUNNEL_PACKAGE_TARGET: ${{ matrix.target }}
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      TUNNEL_REQUIRE_SIGNING: ${{ github.ref_type == 'tag' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /sshTLS-v2ray-tunnel/
            !/sshTLS-v2ray-tunnel/dist/
            !/sshTLS-v2ray-tunnel/tunnel
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: sshTLS-v2ray-tunnel/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sshTLS-v2ray-tunnel/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and version
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version=json.loads(Path('desktop/package.json').read_text())['version']
          if os.environ['GITHUB_REF_TYPE']=='tag':
              assert os.environ['GITHUB_REF_NAME']=='v'+version, 'Tag must match desktop/package.json'
          PY
      - name: Install desktop dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --prefix desktop
      - name: Audit dependencies
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          npm audit --prefix desktop --audit-level=moderate
      - name: Test engine and desktop logic
        run: |
          go test ./...
          go vet ./...
          node --test desktop/*.test.cjs
          node --check desktop/ui/app.js
      - name: Build native engine
        run: python scripts/build.py
      - name: Fetch verified networking cores
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch-cores.py
      - name: Validate generated TUN configurations
        env:
          TUNNEL_VERIFY_BUNDLED_CORES: '1'
        run: go test -run '^TestBundledSingBoxAcceptsTUNConfig$' -count=1 -v
      - name: Exercise Linux TUN capture in isolated namespaces
        if: startsWith(matrix.target, 'linux-')
        run: bash scripts/test-linux-network.sh
      - name: Smoke test bundled executables
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          runtime=Path('dist/runtime')/os.environ['TUNNEL_PACKAGE_TARGET']
          suffix='.exe' if os.name=='nt' else ''
          for executable,args in [('tunnel',['-h']),('cores/xray',['version']),('cores/sing-box',['version'])]:
              subprocess.run([str((runtime/(executable+suffix)).resolve()),*args],check=True,timeout=30)
          PY
      - name: Prepare signing credentials
        env:
          MAC_CERT_P12_B64: ${{ secrets.MAC_CERT_P12_B64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CERT_PFX_B64: ${{ secrets.WIN_CERT_PFX_B64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: python scripts/prepare-signing.py
      - name: Sign networking executables
        run: python scripts/sign-runtime.py
      - name: Package desktop
        run: npm --prefix desktop run package
      - name: Include Windows startup diagnostics
        if: matrix.target == 'win32-x64'
        run: python scripts/windows-release.py
      - name: Archive desktop and CLI
        run: |
          python scripts/archive.py
          python - <<'PY'
          import os
          from pathlib import Path
          for path in Path('dist/releases').glob('*/SHA256SUMS.txt'):
              path.rename(path.with_name('SHA256SUMS-'+os.environ['TUNNEL_PACKAGE_TARGET']+'.txt'))
          PY
      - name: Remove temporary signing credentials
        if: always()
        run: python scripts/cleanup-signing.py
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-${{ matrix.target }}
          path: sshTLS-v2ray-tunnel/dist/releases/*/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /sshTLS-v2ray-tunnel/release-notes/
      - uses: actions/download-artifact@v4
        with:
          pattern: tunnel-*
          path: release-assets
          merge-multiple: true
      - name: Verify and combine checksums
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          folder=Path('release-assets')
          records=[]
          manifests=list(folder.rglob('SHA256SUMS-*.txt'))
          assert len(manifests)==5, 'Missing platform checksum manifests'
          for manifest in manifests:
              for line in manifest.read_text().splitlines():
                  digest,name=line.split('  ',1)
                  asset=manifest.parent/name
                  assert asset.is_file(), 'Missing asset: '+name
                  checksum=hashlib.sha256()
                  with asset.open('rb') as stream:
                      for chunk in iter(lambda:stream.read(1024*1024),b''): checksum.update(chunk)
                  actual=checksum.hexdigest()
                  assert actual==digest, 'Checksum mismatch: '+name
                  records.append(line)
                  destination=folder/name
                  if asset!=destination:
                      assert not destination.exists(), 'Duplicate asset: '+name
                      shutil.move(str(asset),str(destination))
          assert len(records)==10 and len(set(records))==10, 'Expected five desktop and five CLI archives'
          (folder/'SHA256SUMS.txt').write_text('\n'.join(sorted(records))+'\n')
          for manifest in manifests: manifest.unlink()
          for directory in sorted((p for p in folder.rglob('*') if p.is_dir()),key=lambda p:len(p.parts),reverse=True):
              directory.rmdir()
          PY
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          notes="sshTLS-v2ray-tunnel/release-notes/$RELEASE_TAG.md"
          test -f "$notes"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_COMMIT" --title "TunnelNest $RELEASE_TAG" --notes-file "$notes" --draft
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --title "TunnelNest $RELEASE_TAG" --notes-file "$notes"
